(()=>{let cleanup=()=>{};window.CPOptics={dispose(){cleanup();cleanup=()=>{}},attach(){this.dispose();const c=document.getElementById('optical-lens');if(!c)return;const host=c.parentNode,status=document.getElementById('lens-status');if(!settings.glass||settings.contrast||settings.glassMode==='eco'){status.textContent='CSS / ECO';return}let gl;try{gl=c.getContext('webgl',{alpha:false,antialias:false,preserveDrawingBuffer:true});if(!gl)throw Error('WebGL unavailable');const vs='attribute vec2 a; varying vec2 uv; void main(){uv=a*.5+.5;gl_Position=vec4(a,0.,1.);}';const fs=`precision mediump float; varying vec2 uv; uniform vec2 p; uniform float strength; uniform float aspect; uniform sampler2D tex;
